<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#146C43">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>LISS | Light International School System</title>
<style>
:root{--g:#198754;--gd:#146C43;--gl:#EAF6EF;--p:#D96C8A;--pd:#B94F6D;--pl:#FCEEF3;--bg:#f4f8f5;--tx:#1d2b24;--mu:#66756c;--bd:#dfe8e2;--r:14px}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hide{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:20px}
.login .card{width:100%;max-width:380px;text-align:center}
.logo{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;display:block}
h1{font-size:1.25rem}h2{font-size:1.1rem;margin-bottom:10px}
.mu{color:var(--mu);font-size:.88rem}
label{display:block;text-align:left;font-size:.82rem;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#fff}
input:focus,select:focus{outline:2px solid var(--g);border-color:var(--g)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 16px;background:var(--g);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--gd)}.btn.full{width:100%;margin-top:16px}
.btn.alt{background:var(--pl);color:var(--pd)}.btn.alt:hover{background:#f8dce6}
.btn.sm{padding:7px 10px;font-size:.8rem}
.err{color:#b3261e;font-size:.85rem;margin-top:10px;min-height:1em}
header{position:sticky;top:0;z-index:5;background:var(--gd);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
header b{flex:1}header button{background:none;border:0;color:#fff;cursor:pointer;display:flex}
main{max-width:980px;margin:0 auto;padding:16px 16px 90px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:12px 0}
.stat{display:flex;gap:12px;align-items:center}
.stat i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--gl);color:var(--g)}
.stat i.p{background:var(--pl);color:var(--pd)}
.stat strong{font-size:1.5rem;display:block;line-height:1}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.bar input{flex:1;min-width:150px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row>div{flex:1;min-width:0}
.row small{display:block;color:var(--mu);overflow:hidden;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:50%;background:var(--gl);color:var(--gd);display:grid;place-items:center;font-weight:700;border:2px solid var(--p);flex:none}
.tag{font-size:.72rem;background:var(--pl);color:var(--pd);padding:3px 8px;border-radius:99px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mu);cursor:pointer}
nav button.on{color:var(--g);font-weight:700}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:end center;z-index:9}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px;max-height:92vh;overflow:auto}
.note{background:var(--gl);border-radius:10px;padding:10px;font-size:.82rem;margin-top:12px;text-align:left}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:99px;font-size:.88rem;z-index:20}
@media(min-width:760px){nav{position:static;border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px}.modal{place-items:center}.sheet{border-radius:18px}main{padding-bottom:30px}}
@media print{header,nav,.bar,.btn{display:none!important}body.pc #view,body.pc main>nav{display:none}body.pc .modal{position:static;background:none}}
</style></head><body>
<div id="boot" class="login"><p class="mu">Loading…</p></div>

<div id="login" class="login hide"><div class="card">
 <img class="logo" src="logo.png" alt="" onerror="this.src='icon.svg'">
 <h1>Light International School</h1><p class="mu">Education, Light That Never Goes Dull</p>
 <label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" autocorrect="off">
 <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
 <button class="btn full" id="go">Sign in</button><div class="err" id="lerr"></div>
 <button class="btn alt full hide" id="inst">Install app</button>
 <p class="mu" style="margin-top:14px">Accounts are created by the school administrator.</p>
</div></div>

<div id="app" class="hide">
 <header><b id="ttl">LISS</b><button id="inst2" class="hide" title="Install"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></button><button id="out" title="Sign out"><svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button></header>
 <main><nav id="nav"></nav><div id="view"></div></main>
</div><div id="modal" class="modal hide"></div><div id="toast" class="hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://jagvcumigbjxxhgcrada.supabase.co";
const SUPABASE_ANON_KEY="PASTE_YOUR_ANON_PUBLIC_KEY_HERE";
const DOMAIN="@liss.app";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I={home:"M3 11l9-8 9 8M5 10v10h14V10",teacher:"M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21v-2a8 8 0 0 1 16 0v2",student:"M2 9l10-5 10 5-10 5zM6 11v5c3 2.5 9 2.5 12 0v-5",cls:"M4 4h16v16H4zM4 9h16M9 9v11",admin:"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",msg:"M4 5h16v11H9l-5 4z",plus:"M12 5v14M5 12h14",trash:"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${I[n]}"/></svg>`;
let me,people=[],classes=[],msgs=[],unread=0,tab="home",q="";
function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hide"),2800)}
function show(id){["boot","login","app"].forEach(x=>$(x).classList.toggle("hide",x!==id))}

async function start(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session)return show("login");
 const{data,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
 if(error||!data){await sb.auth.signOut();show("login");$("lerr").textContent="This account has no profile. Contact the administrator.";return}
 me=data;tab="home";unread=0;await load();show("app");buildNav();render();if(me.role!=="student")sub();
}
async function load(){
 const c=await sb.from("classes").select("*").order("name");classes=c.data||[];
 const p=await sb.from("profiles").select("*").order("full_name");people=p.data||[];
 if(me.role!=="student"){const m=await sb.from("messages").select("*").order("created_at",{ascending:false}).limit(100);msgs=m.data||[]}
}
$("go").onclick=async()=>{
 const u=$("u").value.trim().toLowerCase(),p=$("pw").value;$("lerr").textContent="";
 if(!u||!p)return $("lerr").textContent="Enter username and password.";
 $("go").disabled=true;
 const{error}=await sb.auth.signInWithPassword({email:u+DOMAIN,password:p});
 $("go").disabled=false;
 if(error)return $("lerr").textContent="Wrong username or password.";
 $("pw").value="";start();
};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=async()=>{await sb.removeAllChannels();await sb.auth.signOut();people=[];msgs=[];show("login")};

function buildNav(){
 const t=me.role==="admin"?[["home","home","Home"],["teachers","teacher","Teachers"],["students","student","Students"],["admins","admin","Admins"],["classes","cls","Classes"],["messages","msg","Chat"]]
  :me.role==="teacher"?[["home","home","Home"],["students","student","Students"],["messages","msg","Chat"]]:[["home","home","Home"]];
 $("nav").innerHTML=t.map(([k,i,l])=>`<button data-t="${k}" class="${k===tab?"on":""}">${ic(i)}${l}${k==="messages"&&unread?` (${unread})`:""}</button>`).join("");
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;q="";if(tab==="messages")unread=0;buildNav();render()});
}
const by=r=>people.filter(p=>p.role===r);
function render(){
 $("ttl").textContent={admin:"Admin dashboard",teacher:"Teacher dashboard",student:"Student dashboard"}[me.role];
 const v=$("view");
 if(tab==="home")v.innerHTML=home();
 else if(tab==="classes")v.innerHTML=clsView();
 else if(tab==="messages")v.innerHTML=msgView();
 else v.innerHTML=listView({teachers:"teacher",students:"student",admins:"admin"}[tab]);
 bind();
}
function home(){
 const hi=`<h1>Welcome, ${esc(me.full_name)}</h1><p class="mu">${me.role==="admin"?"School administrator":me.role==="teacher"?"Teacher":"Student"}</p>`;
 if(me.role==="student")return hi+`<div class="card" style="margin-top:14px"><div class="row"><span class="av">${ini(me.full_name)}</span><div><b>${esc(me.full_name)}</b><small>${esc(me.class_name||"No class yet")} · ${esc(me.username)}</small></div></div></div>`;
 const st=(n,l,i,c="")=>`<div class="card stat"><i class="${c}">${ic(i)}</i><div><strong>${n}</strong><span class="mu">${l}</span></div></div>`;
 const recent=people.filter(p=>p.role!=="admin").sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,5);
 return hi+`<div class="stats">${st(by("student").length,"Students","student")}${me.role==="admin"?st(by("teacher").length,"Teachers","teacher","p")+st(classes.length,"Classes","cls"):""}</div>
 <div class="card"><h2>Recently added</h2>${recent.map(rowHtml).join("")||'<p class="mu">Nobody yet.</p>'}</div>`;
}
const ini=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
function rowHtml(p,del){return`<div class="row"><span class="av">${ini(p.full_name)}</span><div><b>${esc(p.full_name)}</b><small>${esc(p.username)}${p.class_name?" · "+esc(p.class_name):""}</small></div><span class="tag">${p.role}</span>${del&&p.id!==me.id?`<button class="btn alt sm" data-del="${p.id}" title="Delete">${ic("trash")}</button>`:""}</div>`}
function listView(role){
 const admin=me.role==="admin",l=by(role).filter(p=>!q||(p.full_name+p.username+(p.class_name||"")).toLowerCase().includes(q));
 return`<div class="bar"><input id="s" placeholder="Search ${role}s…" value="${esc(q)}">${admin?`<button class="btn" id="add">${ic("plus")}Add ${role}</button>`:""}</div>
 <div class="card">${l.map(p=>rowHtml(p,admin)).join("")||`<p class="mu">No ${role}s found.</p>`}</div>`;
}
function clsView(){return`<div class="bar"><input id="cn" placeholder="New class name"><button class="btn" id="ca">${ic("plus")}Add</button></div>
 <div class="card">${classes.map(c=>`<div class="row"><div><b>${esc(c.name)}</b><small>${by("student").filter(s=>s.class_name===c.name).length} students</small></div><button class="btn alt sm" data-dc="${c.id}">${ic("trash")}</button></div>`).join("")}</div>`}
function bind(){
 const s=$("s");if(s)s.oninput=e=>{q=e.target.value.toLowerCase();const p=e.target.selectionStart;render();const n=$("s");n.focus();n.setSelectionRange(p,p)};
 const a=$("add");if(a)a.onclick=()=>form({teachers:"teacher",students:"student",admins:"admin"}[tab]);
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>del(b.dataset.del));
 document.querySelectorAll("[data-dc]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this class?"))return;const{error}=await sb.from("classes").delete().eq("id",b.dataset.dc);error?toast(error.message):(await load(),render())});
 const ms=$("ms");if(ms)ms.onclick=send;
 const ca=$("ca");if(ca)ca.onclick=async()=>{const n=$("cn").value.trim();if(!n)return;const{error}=await sb.from("classes").insert({name:n});error?toast(error.message):(await load(),render())};
}
function rnd(p){return p+String(Math.floor(10000+Math.random()*90000))}
function form(role){
 const st=role==="student",m=$("modal");
 m.innerHTML=`<div class="sheet"><h2>Add ${role}</h2>
 <label>Full name</label><input id="fn">
 <label>Username (also the password)</label><input id="fu" value="${rnd(st?"stu":role==="admin"?"adm":"tch")}" autocapitalize="none">
 ${st?`<label>Class</label><select id="fc"><option value="">—</option>${classes.map(c=>`<option>${esc(c.name)}</option>`).join("")}</select><label>Guardian</label><input id="fg">`:""}
 <label>Phone</label><input id="fp" type="tel">
 <label>Gender</label><select id="fx"><option value="">—</option><option>Female</option><option>Male</option></select>
 <div class="note">Login: username and password are the same, at least 6 characters.</div>
 <div class="err" id="ferr"></div>
 <div class="bar"><button class="btn alt" id="fx0">Cancel</button><button class="btn" id="fs" style="flex:1">Create account</button></div></div>`;
 m.classList.remove("hide");
 $("fx0").onclick=()=>m.classList.add("hide");
 $("fs").onclick=async()=>{
  const full_name=$("fn").value.trim();if(!full_name)return $("ferr").textContent="Name is required.";
  $("fs").disabled=true;
  const{data,error}=await sb.functions.invoke("admin-users",{body:{action:"create",role,full_name,username:$("fu").value,class_name:st?$("fc").value:null,guardian:st?$("fg").value:null,phone:$("fp").value,gender:$("fx").value}});
  $("fs").disabled=false;
  const msg=data?.error||(error&&error.message);if(msg)return $("ferr").textContent=msg;
  await load();render();cred(m,full_name,$("fu").value.trim().toLowerCase(),role);
 };
}
function cred(m,name,u,role){
 m.innerHTML=`<div class="sheet"><h2>Account created</h2><p class="mu">Give these login details to the ${role} in person.</p>
 <div class="card" id="cc" style="margin-top:12px;background:var(--gl)"><p><b>${esc(name)}</b> · ${role}</p><label>Username</label><b>${esc(u)}</b><label>Password</label><b>${esc(u)}</b></div>
 <div class="bar"><button class="btn alt" id="cp">Copy</button><button class="btn alt" id="pr">Print</button><button class="btn" id="dn" style="flex:1">Done</button></div></div>`;
 $("cp").onclick=()=>navigator.clipboard?.writeText(`LISS login\nName: ${name}\nUsername: ${u}\nPassword: ${u}`).then(()=>toast("Copied"));
 $("pr").onclick=()=>{document.body.classList.add("pc");print();document.body.classList.remove("pc")};
 $("dn").onclick=()=>m.classList.add("hide");
}
function msgList(){return msgs.map(m=>{const s=people.find(p=>p.id===m.sender_id),r=m.recipient_id&&people.find(p=>p.id===m.recipient_id);return`<div class="row"><span class="av">${ini(s?.full_name)}</span><div><b>${esc(m.sender_id===me.id?"You":s?.full_name||"Staff")}</b> <span class="tag">${r?"to "+esc(r.full_name):"all staff"}</span><small style="white-space:normal;color:var(--tx)">${esc(m.body)}</small><small>${new Date(m.created_at).toLocaleString()}</small></div></div>`}).join("")||'<p class="mu">No messages yet.</p>'}
function msgView(){const st=people.filter(p=>p.role!=="student"&&p.id!==me.id);
 return`<div class="card"><h2>New message</h2><label>To</label><select id="mt"><option value="">All staff</option>${st.map(p=>`<option value="${p.id}">${esc(p.full_name)} (${p.role})</option>`).join("")}</select><label>Message</label><input id="mb" maxlength="1000"><button class="btn full" id="ms">Send</button></div><div class="card" style="margin-top:12px" id="ml">${msgList()}</div>`}
async function send(){const body=$("mb").value.trim();if(!body)return;
 const{data,error}=await sb.from("messages").insert({body,recipient_id:$("mt").value||null}).select().single();
 if(error)return toast(error.message);$("mb").value="";if(!msgs.some(x=>x.id===data.id))msgs.unshift(data);$("ml").innerHTML=msgList()}
function sub(){sb.channel("msgs").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{const m=p.new;if(msgs.some(x=>x.id===m.id))return;msgs.unshift(m);
 if(m.sender_id!==me.id){const s=people.find(x=>x.id===m.sender_id);toast("New message from "+(s?.full_name||"staff"));if(tab!=="messages"){unread++;buildNav()}}
 if(tab==="messages")$("ml").innerHTML=msgList()}).subscribe()}
async function del(id){
 const p=people.find(x=>x.id===id);if(!confirm(`Delete ${p.full_name} and their login?`))return;
 const{data,error}=await sb.functions.invoke("admin-users",{body:{action:"delete",id}});
 const msg=data?.error||(error&&error.message);if(msg)return toast(msg);
 toast("Deleted");await load();render();
}
// PWA
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;["inst","inst2"].forEach(i=>$(i).classList.remove("hide"))});
["inst","inst2"].forEach(i=>$(i).onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;["inst","inst2"].forEach(x=>$(x).classList.add("hide"))});
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
start();
</script>
</body>
</html>
